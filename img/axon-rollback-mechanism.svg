<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="axon-rollback-title axon-rollback-desc" class="axon-diagram">
<title id="axon-rollback-title">Non-Destructive Forward-Commit Rollback Mechanism</title>
<desc id="axon-rollback-desc">Comparison diagram contrasting destructive git reset which truncates history and causes cluster divergence against Axon's surgical forward rollback which creates a new linear commit reverting only the target skill.</desc>

<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

.axon-diagram {
--dia-bg: #f8fafc;
--dia-paper: #ffffff;
--dia-ink: #0f172a;
--dia-muted: #64748b;
--dia-soft: #94a3b8;
--dia-border: rgba(15, 23, 42, 0.08);
--dia-border-strong: rgba(15, 23, 42, 0.16);
--dia-accent: #f59e0b;
--dia-accent-dark: #d97706;
--dia-accent-tint: rgba(245, 158, 11, 0.06);
--dia-link: #3b82f6;
--dia-link-tint: rgba(59, 130, 246, 0.06);
--dia-success: #10b981;
--dia-success-tint: rgba(16, 185, 129, 0.06);
--dia-danger: #ef4444;
--dia-danger-tint: rgba(239, 68, 68, 0.06);
--dia-dot: rgba(15, 23, 42, 0.07);
width: 100%;
height: auto;
display: block;
background: var(--dia-bg);
}

.dia-font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.dia-font-mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

@media (prefers-color-scheme: dark) {
.axon-diagram {
--dia-bg: #090d16;
--dia-paper: #111827;
--dia-ink: #f1f5f9;
--dia-muted: #94a3b8;
--dia-soft: #64748b;
--dia-border: rgba(255, 255, 255, 0.08);
--dia-border-strong: rgba(255, 255, 255, 0.16);
--dia-accent: #fbbf24;
--dia-accent-dark: #f59e0b;
--dia-accent-tint: rgba(251, 191, 36, 0.1);
--dia-link: #60a5fa;
--dia-link-tint: rgba(96, 165, 250, 0.1);
--dia-success: #34d399;
--dia-success-tint: rgba(52, 211, 153, 0.1);
--dia-danger: #f87171;
--dia-danger-tint: rgba(248, 113, 113, 0.1);
--dia-dot: rgba(255, 255, 255, 0.05);
}
}
</style>

<pattern id="dotgrid-rollback" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1" fill="var(--dia-dot)"/>
</pattern>

<marker id="arr-rm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="var(--dia-muted)"/>
</marker>
<marker id="arr-rsuc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="var(--dia-success)"/>
</marker>
<marker id="arr-rdan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="var(--dia-danger)"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="var(--dia-bg)"/>
<rect width="100%" height="100%" fill="url(#dotgrid-rollback)"/>

<g transform="translate(30, 24)">

<!-- ================= PANEL 1: Destructive Git Reset ================= -->
<g transform="translate(0, 0)">
  <rect width="900" height="160" rx="8" fill="var(--dia-paper)" stroke="var(--dia-danger)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="16" y="14" width="210" height="20" rx="3" fill="var(--dia-danger-tint)"/>
  <text x="24" y="28" fill="var(--dia-danger)" font-size="9" font-weight="700" class="dia-font-mono">TRADITIONAL GIT RESET (DESTRUCTIVE)</text>
  <text x="240" y="28" fill="var(--dia-muted)" font-size="9" class="dia-font-sans">History rewritten, remote diverged, cross-node cluster sync fails</text>

  <!-- Commit Chain C1 -> C2 -> C3 -->
  <g transform="translate(40, 60)">
    <!-- Commit C1 -->
    <circle cx="40" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-muted)" stroke-width="1.6"/>
    <text x="40" y="34" fill="var(--dia-ink)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C1</text>
    <text x="40" y="62" fill="var(--dia-muted)" font-size="8" class="dia-font-mono" text-anchor="middle">v1.0.0</text>

    <!-- Edge C1 -> C2 -->
    <path d="M 58,30 H 162" stroke="var(--dia-muted)" stroke-width="1.4" marker-end="url(#arr-rm)"/>

    <!-- Commit C2 -->
    <circle cx="180" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-muted)" stroke-width="1.6"/>
    <text x="180" y="34" fill="var(--dia-ink)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C2</text>
    <text x="180" y="62" fill="var(--dia-muted)" font-size="8" class="dia-font-mono" text-anchor="middle">edit skill A</text>

    <!-- Edge C2 -> C3 -->
    <path d="M 198,30 H 302" stroke="var(--dia-muted)" stroke-width="1.4" marker-end="url(#arr-rm)"/>

    <!-- Commit C3 -->
    <circle cx="320" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-danger)" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="320" y="34" fill="var(--dia-danger)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C3</text>
    <text x="320" y="62" fill="var(--dia-danger)" font-size="8" class="dia-font-mono" text-anchor="middle">add skill B</text>

    <!-- Reset Arc back to C1 -->
    <path d="M 320,12 C 240,-15 120,-15 40,12" stroke="var(--dia-danger)" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-rdan)" fill="none"/>
    <rect x="140" y="-12" width="100" height="16" rx="2" fill="var(--dia-paper)"/>
    <text x="190" y="0" fill="var(--dia-danger)" font-size="8" font-weight="700" class="dia-font-mono" text-anchor="middle">git reset --hard C1</text>
  </g>

  <!-- Right Callout -->
  <g transform="translate(480, 52)">
    <rect width="380" height="74" rx="6" fill="var(--dia-danger-tint)" stroke="var(--dia-danger)" stroke-width="0.8"/>
    <text x="14" y="24" fill="var(--dia-danger)" font-size="10" font-weight="700" class="dia-font-sans">⚠ Critical Pitfalls in Multi-Machine Setup:</text>
    <text x="14" y="42" fill="var(--dia-ink)" font-size="8.5" class="dia-font-sans">• Drops C3 completely (unrelated changes in skill B are permanently lost)</text>
    <text x="14" y="58" fill="var(--dia-ink)" font-size="8.5" class="dia-font-sans">• Causes non-fast-forward push rejection across all cluster nodes</text>
  </g>
</g>

<!-- ================= PANEL 2: Axon Forward Rollback ================= -->
<g transform="translate(0, 185)">
  <rect width="900" height="185" rx="8" fill="var(--dia-paper)" stroke="var(--dia-success)" stroke-width="1.4"/>
  <rect x="16" y="14" width="225" height="20" rx="3" fill="var(--dia-success-tint)"/>
  <text x="24" y="28" fill="var(--dia-success)" font-size="9" font-weight="700" class="dia-font-mono">AXON SURGICAL ROLLBACK (NON-DESTRUCTIVE)</text>
  <text x="255" y="28" fill="var(--dia-muted)" font-size="9" class="dia-font-sans">History preserved, single asset inverted, cluster fast-forwards smoothly</text>

  <!-- Commit Chain C1 -> C2 -> C3 -> C4 -->
  <g transform="translate(40, 65)">
    <!-- Commit C1 -->
    <circle cx="40" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-muted)" stroke-width="1.6"/>
    <text x="40" y="34" fill="var(--dia-ink)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C1</text>
    <text x="40" y="62" fill="var(--dia-muted)" font-size="8" class="dia-font-mono" text-anchor="middle">v1.0.0</text>

    <!-- Edge C1 -> C2 -->
    <path d="M 58,30 H 122" stroke="var(--dia-muted)" stroke-width="1.4" marker-end="url(#arr-rm)"/>

    <!-- Commit C2 -->
    <circle cx="140" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-muted)" stroke-width="1.6"/>
    <text x="140" y="34" fill="var(--dia-ink)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C2</text>
    <text x="140" y="62" fill="var(--dia-muted)" font-size="8" class="dia-font-mono" text-anchor="middle">edit skill A</text>

    <!-- Edge C2 -> C3 -->
    <path d="M 158,30 H 222" stroke="var(--dia-muted)" stroke-width="1.4" marker-end="url(#arr-rm)"/>

    <!-- Commit C3 -->
    <circle cx="240" cy="30" r="18" fill="var(--dia-paper)" stroke="var(--dia-muted)" stroke-width="1.6"/>
    <text x="240" y="34" fill="var(--dia-ink)" font-size="10" font-weight="600" class="dia-font-mono" text-anchor="middle">C3</text>
    <text x="240" y="62" fill="var(--dia-muted)" font-size="8" class="dia-font-mono" text-anchor="middle">add skill B</text>

    <!-- Edge C3 -> C4 -->
    <path d="M 258,30 H 322" stroke="var(--dia-success)" stroke-width="1.8" marker-end="url(#arr-rsuc)"/>

    <!-- Commit C4: Forward Revert -->
    <circle cx="340" cy="30" r="20" fill="var(--dia-success-tint)" stroke="var(--dia-success)" stroke-width="2"/>
    <text x="340" y="34" fill="var(--dia-success)" font-size="10" font-weight="700" class="dia-font-mono" text-anchor="middle">C4</text>
    <text x="340" y="64" fill="var(--dia-success)" font-size="8" font-weight="600" class="dia-font-mono" text-anchor="middle">revert skill A</text>

    <!-- Extraction Curved Arrow from C1 to C4 -->
    <path d="M 40,48 C 120,95 260,95 330,50" stroke="var(--dia-accent)" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arr-acc)" fill="none"/>
    <rect x="140" y="78" width="140" height="15" rx="2" fill="var(--dia-paper)" stroke="var(--dia-accent)" stroke-width="0.6"/>
    <text x="210" y="89" fill="var(--dia-accent-dark)" font-size="7.5" font-weight="600" class="dia-font-mono" text-anchor="middle">Extract skill A snapshot</text>
  </g>

  <!-- Right Callout -->
  <g transform="translate(480, 52)">
    <rect width="380" height="100" rx="6" fill="var(--dia-success-tint)" stroke="var(--dia-success)" stroke-width="0.8"/>
    <text x="14" y="24" fill="var(--dia-success)" font-size="10" font-weight="700" class="dia-font-sans">✓ The Axon Engineering Advantage:</text>
    <text x="14" y="44" fill="var(--dia-ink)" font-size="8.5" class="dia-font-sans">• Strictly scoped: only target skill is reverted; C3 (skill B) remains intact</text>
    <text x="14" y="62" fill="var(--dia-ink)" font-size="8.5" class="dia-font-sans">• Always forward-commit: Git history stays strictly linear</text>
    <text x="14" y="80" fill="var(--dia-ink)" font-size="8.5" class="dia-font-sans">• Zero cluster drift: other machines fast-forward seamlessly via axon sync</text>
  </g>
</g>
</g>
</svg>
