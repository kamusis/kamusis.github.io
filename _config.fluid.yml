# ---------------------------------------------------------------
# Hexo Theme Fluid Custom Configuration (Pure English & Elegant)
# Reference: https://hexo.fluid-dev.com/docs/guide/
# ---------------------------------------------------------------

# 站点图标（保留原有 favicon）
favicon: /favicon.ico
apple_touch_icon: /img/favicon.png

# 导航栏配置（开启毛玻璃柔和过渡，消除生硬色块）
navbar:
  blog_title: "Kamus' Notes"
  ground_glass:
    enable: true
    px: 10
    alpha: 0.82
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 首页视觉与标语配置（秋天：暮色、极光、丰盈与沉思）
index:
  banner_img: /img/banner-autumn.webp
  banner_img_height: 100
  banner_mask_alpha: 0.18
  slogan:
    enable: true
    text: "Autumn tides, deep systems, and thinking machines."

# 文章正文与阅读体验（全英文格式化）
post:
  banner_img: /img/banner-autumn.webp
  banner_img_height: 48
  banner_mask_alpha: 0.28
  meta:
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
      format: "{} words"
    min2read:
      enable: true
      format: "{} min read"
  toc:
    enable: true
    headingSelector: "h1,h2,h3,h4,h5,h6"
    collapseDepth: 0
  copyright:
    enable: true
    license: 'BY-NC-SA'
    author:
      enable: true
    post_date:
      enable: true
      format: "LL"
    update_date:
      enable: false
      format: "LL"

# ---------------------------------------------------------------
# 四季主题独立页：同机位、同画风，四时景致流转与专属诗意文案
# ---------------------------------------------------------------

# 归档页 (Archives) — 冬天：霜雪封存，年轮结晶
archive:
  banner_img: /img/banner-winter.webp
  banner_img_height: 48
  banner_mask_alpha: 0.22
  subtitle: "Frozen tides and quiet years: chronicles etched in winter light."

# 分类页 (已根据实际情况禁用，全站使用 Tags)
category:
  enable: false
  order_by: "-length"
  collapse_depth: 0

# 标签页 (Tags) — 春天：春花漫山，萌芽连缀
tag:
  enable: true
  banner_img: /img/banner-spring.webp
  banner_img_height: 48
  banner_mask_alpha: 0.22
  subtitle: "Wildflowers of insight, blooming across constellations of thought."

# 关于页 (About) — 夏天：暖阳夕照，生命炽热，守望灯塔
about:
  enable: true
  banner_img: /img/banner-summer.webp
  banner_img_height: 48
  banner_mask_alpha: 0.22
  subtitle: "Sunlight upon the beacon: a craftsman's journey between tide and code."
  avatar: /img/avatar.png
  name: "Kamus"
  intro: "Database Architect · Systems Explorer · AI Engineering Practitioner"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/kamusis", tip: "GitHub" }
    - { class: "iconfont icon-twitter-fill", link: "https://twitter.com/kamusis", tip: "Twitter / X" }
    - { class: "iconfont icon-linkedin-fill", link: "https://www.linkedin.com/in/kamus/", tip: "LinkedIn" }
    - { class: "iconfont icon-mail", link: "mailto:kamusis@gmail.com", tip: "Email" }

# 其他独立页面与404
page:
  banner_img: /img/banner.webp
  banner_img_height: 48
  banner_mask_alpha: 0.22

page404:
  banner_img: /img/banner.webp
  banner_img_height: 48
  banner_mask_alpha: 0.22
  subtitle: "Lost at sea: the requested coordinates do not exist."

# 动效克制：仅在首页开启副标题打字机，彻底关闭文章页与独立页打字动效
fun_features:
  typing:
    enable: true
    typeSpeed: 25
    cursorChar: "_"
    loop: false
    scope: ['home']

# 颜色系统（柔和纸气质感底色，告别生冷灰）
color:
  body_bg_color: "#f9fafb"
  body_bg_color_dark: "#0b1120"
  board_color: "#ffffff"
  board_color_dark: "#111827"
  text_color: "#334155"
  text_color_dark: "#cbd5e1"
  post_heading_color: "#0f172a"
  post_heading_color_dark: "#f1f5f9"
  link_hover_color: "#fbbf24"
  link_hover_color_dark: "#fcd34d"
  dark_mode:
    enable: true
    default: "auto"

# 现代工程与设计字体定制
custom_css:
  - /css/custom.css

# 代码块体验
code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "github gist"
      style_dark: "atom-one-dark"

# 搜索
search:
  enable: true
